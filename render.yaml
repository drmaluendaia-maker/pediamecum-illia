services:
  - type: web
    runtime: static
    name: pediamecum-illia
    buildCommand: npm test && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
